server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    charset utf-8;

    location / {
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        try_files $uri $uri/ =404;
    }

    location ~* \.zip$ {
        add_header Content-Disposition "attachment";
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }
}
